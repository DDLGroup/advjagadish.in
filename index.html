              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Under Section 100 of the Code of Civil Procedure 1908, a Second Appeal before the High Court at Calcutta is maintainable strictly on a Substantial Question of Law. Factual findings arrived at by the first appellate court are normally final, unless demonstrated to be perverse, based on no evidence, or arrived at by misreading material evidence."

                "@type": "Answer",
